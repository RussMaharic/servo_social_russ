services:
  - type: web
    name: t2-connect-directory
    runtime: python
    rootDir: dexops
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: t2-directory --host 0.0.0.0
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
