[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "t2-bots"
version = "0.3.1"
description = "Universal Physical AI Hardware Abstraction Layer & Distributed Teleoperation SDK"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mindflow / t2-BOTS Team" }]
dependencies = [
    "pyserial>=3.5",
    "websockets>=12.0",
    "importlib-metadata>=3.6; python_version < '3.10'",
]

[project.optional-dependencies]
ai = ["numpy>=1.20"]
gateway = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "pydantic>=2.0.0"]
directory = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "pydantic>=2.0.0", "psycopg[binary]==3.3.6"]
test = ["pytest>=7.0", "pytest-asyncio>=0.21"]
all = [
    "numpy>=1.20",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
dev = ["build>=1.0", "pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.27"]

[project.scripts]
t2-bots = "t2_bots.cli:main"
t2-connect = "t2_bots.connect.app:main"
dexops = "t2_bots.connect.app:dexops_main"
t2-directory = "t2_bots.connect.directory:main"

[project.entry-points."t2_bots.drivers"]
so101 = "t2_bots_so101:SO101Manipulator"
so101_leader = "t2_bots_so101:SO101Teleoperator"

[tool.setuptools.packages.find]
where = ["src"]
include = ["t2_bots", "t2_bots.*", "t2_bots_so101", "t2_bots_so101.*"]
namespaces = true

[tool.setuptools.package-data]
"t2_bots.connect" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
