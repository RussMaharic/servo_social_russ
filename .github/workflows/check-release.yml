name: Dexops checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-app:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python-version: ['3.10', '3.12']
    defaults:
      run:
        working-directory: dexops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the maintained app
        run: |
          python -m pip install --require-hashes -r requirements-companion.lock
          python -m pip install -e ".[gateway,dev]"
      - name: Verify simulated hardware, calibration and session recovery
        run: python -m pytest -q
      - name: Verify onboarding and dashboard
        run: node --test tests/*.test.cjs

  verify-download:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dexops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source build tools
        run: python -m pip install build
      - name: Build matching source download and metadata
        env:
          T2_DIRECTORY_URL: https://servo-social-russ-1.onrender.com
        run: python scripts/build-vercel-site.py
